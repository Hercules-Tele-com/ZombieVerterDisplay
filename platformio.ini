;
; PlatformIO Project Configuration File
; ZombieVerterDisplay - Multi-Display Support
;
; Build environments for both SPI and Waveshare RGB displays
;
; Usage:
;   pio run -e waveshare_7inch    # Build for Waveshare ESP32-S3-Touch-LCD-7
;   pio run -e spi_display         # Build for original SPI display
;   pio run                        # Build default (Waveshare)
;

[platformio]
default_envs = waveshare_7inch
src_dir = .
include_dir = .

; ============================================================
; Common settings shared by all environments
; ============================================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize
    time

; Upload Settings
upload_speed = 921600

; Common Build Flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Common Libraries (required by all environments)
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/ayushsharma82/ElegantOTA.git
    lvgl/lvgl @ ^8.3.11

; Filesystem for web server files
board_build.filesystem = littlefs

; ============================================================
; Environment: Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB)
; ============================================================
[env:waveshare_7inch]
; Board Configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi

; Partition Scheme - Large app partition for LVGL and assets
board_build.partitions = default_16MB.csv

; Build Flags specific to Waveshare Display
build_flags =
    ${env.build_flags}
    -DUSE_WAVESHARE_7INCH_RGB
    -DARDUINO_USB_MODE=1
    -DARDUINO_ESP32S3_DEV

    ; PSRAM Configuration
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw

    ; LVGL Configuration
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE

    ; Display specific
    -DDISPLAY_WIDTH=800
    -DDISPLAY_HEIGHT=480

; Libraries specific to Waveshare RGB Display
lib_deps =
    ${env.lib_deps}
    esp-arduino-libs/ESP32_Display_Panel @ ^0.1.4
    esp-arduino-libs/ESP32_IO_Expander @ ^0.0.3

; Upload Port (modify if needed)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; ============================================================
; Environment: SPI Display (320x170)
; ============================================================
[env:spi_display]
; Board Configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Partition Scheme
board_build.partitions = default.csv

; Build Flags specific to SPI Display
build_flags =
    ${env.build_flags}
    -DUSE_SPI_DISPLAY
    -DARDUINO_USB_MODE=1
    -DARDUINO_ESP32S3_DEV

    ; LVGL Configuration
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE

    ; Display specific
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=170

    ; TFT_eSPI User Setup (if you have custom User_Setup.h)
    ; -DUSER_SETUP_LOADED=1
    ; Add your TFT_eSPI pin definitions here if needed

; Libraries specific to SPI Display
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43

; Upload Port (modify if needed)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; ============================================================
; Environment: Waveshare with Debug
; ============================================================
[env:waveshare_7inch_debug]
extends = env:waveshare_7inch
build_type = debug
build_flags =
    ${env:waveshare_7inch.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -O0
    -g

; ============================================================
; Environment: SPI with Debug
; ============================================================
[env:spi_display_debug]
extends = env:spi_display
build_type = debug
build_flags =
    ${env:spi_display.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -O0
    -g
